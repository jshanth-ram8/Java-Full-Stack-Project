spring.application.name=ambulance-system
server.port=${PORT:8080}

# ---- Default database: SQLite (a file called ambulance.db, created automatically) ----
# foreign_keys=on makes SQLite refuse deletes of rows that other rows depend on.
# To use MySQL instead, start with the "mysql" profile (see application-mysql.properties).
spring.datasource.url=jdbc:sqlite:ambulance.db?foreign_keys=on
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

server.servlet.session.timeout=60m

# First administrator account (created once, only if no admin exists).
# Set ADMIN_EMAIL and ADMIN_PASSWORD in production.
app.admin.email=${ADMIN_EMAIL:admin@ambulance.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
